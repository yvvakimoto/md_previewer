[package]
name = "md-previewer"
version = "0.30.0"
edition = "2021"
license = "MIT"

[dependencies]
tao = "0.16"
wry = "0.24"
pulldown-cmark = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
urlencoding = "2.1"
base64 = "0.21"
regex = "1"
rfd = "0.14"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# Pinned to the versions wry 0.24 uses so the ICoreWebView2 type returned by
# `WebViewExtWindows::controller()` matches (used by src/pdf_win.rs for PDF export).
webview2-com = "0.19"
windows = "0.39"

[build-dependencies]
embed-resource = "2"

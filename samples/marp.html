<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>marp</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f5f5f5;
        }

        #drop-zone {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            border: 3px dashed #bdc3c7;
            margin: 20px;
            border-radius: 10px;
            background: white;
            transition: all 0.3s ease;
        }

        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            z-index: 9999;
            transition: opacity 0.2s ease;
        }
        #splash.hidden { opacity: 0; pointer-events: none; }
        #splash .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #e1e4e8;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: splash-spin 0.8s linear infinite;
        }
        #splash .label {
            margin-top: 16px;
            font-size: 13px;
            color: #7f8c8d;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        @keyframes splash-spin { to { transform: rotate(360deg); } }
        body.dark-mode #splash { background: #0d1117; }
        body.dark-mode #splash .label { color: #8b949e; }
        body.dark-mode #splash .spinner { border-color: #30363d; border-top-color: #58a6ff; }

        #drop-zone.drag-over {
            border-color: #3498db;
            background: #ebf5fb;
        }

        .drop-icon {
            font-size: 64px;
            color: #95a5a6;
            margin-bottom: 20px;
        }

        .drop-text {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .drop-hint {
            font-size: 14px;
            color: #95a5a6;
        }

        #preview-container {
            flex: 1;
            overflow-y: auto;
            background: white;
        }

        #preview {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Full-width layout toggle (W key). Placed before the marp rule so
           body.marp #preview (same specificity, later in source) still wins
           in Marp mode — i.e. this is a natural no-op for slides. */
        body.wide #preview {
            max-width: none;
            padding: 40px 48px;   /* 視認性のための最低限の左右マージン */
        }


        /* Markdown styling */
        #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
        }

        #preview h1 {
            font-size: 2em;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
        }

        #preview h2 {
            font-size: 1.5em;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
        }

        #preview h3 { font-size: 1.25em; }
        #preview h4 { font-size: 1em; }
        #preview h5 { font-size: 0.875em; }
        #preview h6 { font-size: 0.85em; color: #6a737d; }

        /* Section numbering (toggled by `N` key). Themes can override the
           ::before content / styling for a custom presentation. */
        body.numbered #preview { counter-reset: num-h2; }
        body.numbered #preview h2 { counter-increment: num-h2; counter-reset: num-h3; }
        body.numbered #preview h3 { counter-increment: num-h3; counter-reset: num-h4; }
        body.numbered #preview h4 { counter-increment: num-h4; }

        body.numbered #preview h2::before {
            content: counter(num-h2) ".\00a0\00a0";
            display: inline;
            font-variant-numeric: tabular-nums;
        }
        body.numbered #preview h3::before {
            content: counter(num-h2) "." counter(num-h3) "\00a0\00a0";
            display: inline;
            font-variant-numeric: tabular-nums;
        }
        body.numbered #preview h4::before {
            content: counter(num-h2) "." counter(num-h3) "." counter(num-h4) "\00a0\00a0";
            display: inline;
            font-variant-numeric: tabular-nums;
        }

        /* Mirror the numbering into the TOC sidebar. Uses a separate counter
           family so theme overrides on `#preview h2::before` etc. don't bleed
           into the sidebar. */
        body.numbered #toc-nav { counter-reset: num-toc-h2; }
        body.numbered #toc-nav .toc-item[data-level="2"] {
            counter-increment: num-toc-h2;
            counter-reset: num-toc-h3;
        }
        body.numbered #toc-nav .toc-item[data-level="3"] {
            counter-increment: num-toc-h3;
            counter-reset: num-toc-h4;
        }
        body.numbered #toc-nav .toc-item[data-level="4"] {
            counter-increment: num-toc-h4;
        }
        body.numbered #toc-nav .toc-item[data-level="2"]::before {
            content: counter(num-toc-h2) ".\00a0\00a0";
            font-variant-numeric: tabular-nums;
        }
        body.numbered #toc-nav .toc-item[data-level="3"]::before {
            content: counter(num-toc-h2) "." counter(num-toc-h3) "\00a0\00a0";
            font-variant-numeric: tabular-nums;
        }
        body.numbered #toc-nav .toc-item[data-level="4"]::before {
            content: counter(num-toc-h2) "." counter(num-toc-h3) "." counter(num-toc-h4) "\00a0\00a0";
            font-variant-numeric: tabular-nums;
        }

        #preview p {
            margin-bottom: 16px;
            line-height: 1.6;
        }

        #preview code {
            background: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 85%;
        }

        #preview pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 16px;
            position: relative;
        }

        #preview pre code {
            background: none;
            padding: 0;
        }

        /* Code block wrapper for copy button */
        .code-block-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .copy-button {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 6px 12px;
            background: #ffffff;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #24292e;
            transition: all 0.2s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
        }

        .code-block-wrapper:hover .copy-button {
            opacity: 1;
        }

        .copy-button:hover {
            background: #f3f4f6;
            border-color: #959da5;
        }

        .copy-button:active {
            background: #edeff2;
        }

        .copy-button.copied {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        /* Per-table "Copy table" button (rich-HTML copy for PowerPoint; see addTableCopyButtons).
           Reuses .copy-button base styling + dark-mode variants; only needs a positioning context. */
        .table-block-wrapper {
            position: relative;
        }

        .table-block-wrapper:hover .table-copy-button {
            opacity: 1;
        }

        /* Right-click "Copy MathML / Copy LaTeX" menu for rendered KaTeX (see setupMathContextMenu). */
        .math-context-menu {
            position: fixed;
            z-index: 10000;
            min-width: 150px;
            padding: 4px;
            background: #ffffff;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(27, 31, 35, 0.18);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            font-size: 13px;
            color: #24292e;
            user-select: none;
        }

        .math-context-menu .math-menu-item {
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .math-context-menu .math-menu-item:hover {
            background: #f3f4f6;
        }

        .math-context-menu .math-menu-item.disabled {
            color: #a0a4a8;
            cursor: default;
        }

        .math-context-menu .math-menu-item.disabled:hover {
            background: transparent;
        }

        .math-context-menu .math-menu-item.copied {
            background: #28a745;
            color: #ffffff;
        }

        /* Right-click menu for the workspace file tree (see setupFileTreeContextMenu). */
        .ft-context-menu {
            position: fixed;
            z-index: 10000;
            min-width: 150px;
            padding: 4px;
            background: #ffffff;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(27, 31, 35, 0.18);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            font-size: 13px;
            color: #24292e;
            user-select: none;
        }
        .ft-context-menu .ft-menu-item {
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .ft-context-menu .ft-menu-item:hover { background: #f3f4f6; }

        #preview blockquote {
            border-left: 4px solid #dfe2e5;
            padding-left: 16px;
            color: #6a737d;
            margin-bottom: 16px;
        }

        /* Text alignment (::: center / right / left fenced divs). The #preview
           descendant selector also reaches Marp slide sections (inside the
           foreignObject), like the existing footnote / split rules. Scoped to
           #preview so it never touches marp-core's own `span.align-center`. */
        #preview .align-center { text-align: center; }
        #preview .align-right  { text-align: right; }
        #preview .align-left   { text-align: left; }

        /* Emphasized centered message (::: message). Minimal frame — emphasis
           comes from large bold centered text plus thin accent rules. accent /
           bg / text color are received via --md-message-* custom properties so a
           Marp theme or user style can override them by setting the variable on
           `section` / `#preview` — variable inheritance sidesteps the high
           `#preview` ID specificity. Scoped to #preview so it reaches Marp slide
           sections inside the foreignObject and carries into HTML export. */
        #preview .md-message {
            text-align: center;
            font-size: 1.6em;
            font-weight: 700;
            line-height: 1.5;
            max-width: 90%;
            margin: 1.2em auto;
            padding: 0.5em 0.8em;
            font-family: var(--md-message-font, inherit);
            color: var(--md-message-color, inherit);
            background: var(--md-message-bg, transparent);
            border-top: 2px solid var(--md-message-accent, #0366d6);
            border-bottom: 2px solid var(--md-message-accent, #0366d6);
        }
        #preview .md-message > :first-child { margin-top: 0; }
        #preview .md-message > :last-child  { margin-bottom: 0; }
        body.dark-mode #preview .md-message { --md-message-accent: #58a6ff; }

        /* Blockquote attribution (> -- Author) */
        #preview blockquote > .bq-attribution {
            text-align: right;
            font-style: italic;
            margin-top: 0.4em;
            margin-bottom: 0;
        }

        #preview ul, #preview ol {
            margin-bottom: 16px;
            padding-left: 2em;
        }

        #preview li {
            margin-bottom: 4px;
        }

        #preview table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }

        #preview th, #preview td {
            border: 1px solid #dfe2e5;
            padding: 6px 13px;
        }

        #preview th {
            background: #f6f8fa;
            font-weight: 600;
        }

        #preview img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Video / YouTube embeds (image-syntax) */
        #preview .video-embed {
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }
        #preview video.video-embed {
            height: auto;
        }
        /* Responsive 16:9 for YouTube iframes without an explicit size */
        #preview iframe.youtube-embed {
            border: 0;
        }
        #preview iframe.youtube-embed:not([width]) {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
        }

        #preview a {
            color: #0366d6;
            text-decoration: none;
        }

        #preview a:hover {
            text-decoration: underline;
        }

        #preview hr {
            border: none;
            border-top: 1px solid #dfe2e5;
            margin: 24px 0;
        }

        /* Mermaid diagram styling */
        .mermaid {
            margin: 16px 0;
            text-align: center;
        }

        /* KaTeX math styling */
        .katex-display {
            margin: 16px 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .katex {
            font-size: 1.1em;
        }

        /* Plotly chart styling (CSV-driven). The block stays a normal block-level
           box (NOT flex): Plotly renders into this element directly, so it must give
           Plotly's autosize/responsive the full container width to measure and let the
           chart anchor at the left edge. A flex container with justify-content:center
           here made the chart center-overflow — spilling off the LEFT — whenever its
           rendered width exceeded the container (chart measured at 0/narrow width
           before layout settled, or an explicit layout.width wider than the column). */
        .plotly-block {
            margin: 16px 0;
            min-height: 320px;
        }
        /* In Marp slides every section is a flex column; margin auto lets the chart
           (a flex item) absorb leftover vertical space and sit centered in the
           remaining area below the text content. The block itself is a flex COLUMN
           with justify-content:center so the chart is vertically centered within the
           block's min-height box too (restores the centering the old flex-row layout
           gave via align-items:center). flex-direction:column keeps justify-content on
           the VERTICAL axis only — no horizontal centering — so it never reintroduces
           the off-the-left overflow a row-wise justify-content:center caused; the
           default cross-axis stretch keeps the chart full-width so Plotly still
           autosizes to the container. Scoped to body.marp, so it also governs the
           exported Marp artifact (whose <body> now carries the marp class). */
        body.marp .plotly-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: auto;
            margin-bottom: auto;
        }
        .plotly-error {
            margin: 16px 0;
            padding: 12px 16px;
            border: 1px solid #d73a49;
            border-radius: 4px;
            background: #ffeef0;
            color: #b31d28;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }
        body.dark-mode .plotly-error {
            background: #2a0d10;
            border-color: #f85149;
            color: #ffa198;
        }

        /* ABC music notation (abcjs, assets/libs/abcjs/) */
        .abc-notation {
            margin: 16px 0;
            text-align: center;
        }
        .abc-notation svg {
            max-width: 100%;
            height: auto;
        }
        /* abcjs emits monochrome (black) SVG; recolor for dark mode. */
        body.dark-mode .abc-notation svg path,
        body.dark-mode .abc-notation svg text,
        body.dark-mode .abc-notation svg rect,
        body.dark-mode .abc-notation svg line {
            fill: #d0d0d0;
            stroke: #d0d0d0;
        }
        .abc-error {
            margin: 16px 0;
            padding: 12px 16px;
            border: 1px solid #d73a49;
            border-radius: 4px;
            background: #ffeef0;
            color: #b31d28;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            text-align: left;
        }
        body.dark-mode .abc-error {
            background: #2a0d10;
            border-color: #f85149;
            color: #ffa198;
        }

        /* App container - flex layout for sidebar + content */
        #app-container {
            display: none;
            flex: 1;
            flex-direction: row;
            overflow: hidden;
            height: 100vh;
        }

        /* TOC Sidebar */
        #toc-sidebar {
            width: 280px;
            min-width: 280px;
            background: #f8f9fa;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, min-width 0.3s ease;
            position: relative;
        }

        #toc-sidebar.collapsed {
            width: 50px;
            min-width: 50px;
        }

        #toc-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #toc-toggle:hover {
            background: #e1e4e8;
        }

        .toggle-icon {
            display: block;
            width: 18px;
            height: 2px;
            background: #586069;
            position: relative;
        }

        .toggle-icon::before,
        .toggle-icon::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 2px;
            background: #586069;
            left: 0;
        }

        .toggle-icon::before {
            top: -6px;
        }

        .toggle-icon::after {
            top: 6px;
        }

        #toc-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            opacity: 1;
            transition: opacity 0.2s ease;
            overflow: hidden;
        }

        #toc-sidebar.collapsed #toc-content {
            opacity: 0;
            pointer-events: none;
        }

        #toc-title {
            padding: 16px 48px 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #24292e;
            border-bottom: 1px solid #e1e4e8;
            flex-shrink: 0;
        }

        #toc-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .toc-item {
            display: block;
            padding: 6px 16px;
            color: #586069;
            text-decoration: none;
            font-size: 13px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .toc-item:hover {
            background: #e1e4e8;
            color: #24292e;
        }

        .toc-item.active {
            background: #dbeafe;
            color: #0366d6;
            border-right: 3px solid #0366d6;
        }

        .toc-item[data-level="1"] { padding-left: 16px; font-weight: 600; }
        .toc-item[data-level="2"] { padding-left: 28px; }
        .toc-item[data-level="3"] { padding-left: 40px; }
        .toc-item[data-level="4"] { padding-left: 52px; font-size: 12px; }
        .toc-item[data-level="5"] { padding-left: 64px; font-size: 12px; }
        .toc-item[data-level="6"] { padding-left: 76px; font-size: 12px; }

        .toc-empty {
            padding: 16px;
            color: #6a737d;
            font-size: 13px;
            font-style: italic;
        }

        /* Workspace ToC (file tree with foldable per-file heading hierarchy) */
        #file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        #file-tree.empty { display: none; }
        #file-tree-title {
            padding: 12px 48px 8px 16px;
            font-size: 11px;
            font-weight: 600;
            color: #6a737d;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        #file-tree ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        #file-tree li { margin: 0; }
        #file-tree .ft-item {
            display: block;
            padding: 4px 8px 4px 24px;
            color: #24292e;
            text-decoration: none;
            font-size: 13px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border-left: 2px solid transparent;
        }
        #file-tree .ft-item:hover { background: #e1e4e8; }
        #file-tree .ft-item.active {
            background: #dbeafe;
            color: #0366d6;
            border-left-color: #0366d6;
            font-weight: 600;
        }
        #file-tree details { margin: 0; }
        #file-tree details > summary {
            list-style: none;
            cursor: pointer;
            font-size: 13px;
            color: #24292e;
            user-select: none;
            display: flex;
            align-items: center;
            padding: 0;
        }
        #file-tree details > summary::-webkit-details-marker { display: none; }
        #file-tree details > summary::before {
            content: '▸';
            display: inline-block;
            width: 12px;
            margin-left: 8px;
            margin-right: 0;
            transition: transform 0.15s ease;
            color: #6a737d;
            font-size: 10px;
            flex-shrink: 0;
        }
        #file-tree details[open] > summary::before { transform: rotate(90deg); }
        /* Group summary (folder) carries label inline. */
        #file-tree details.ft-group > summary {
            padding: 4px 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            font-size: 11px;
            color: #6a737d;
        }
        #file-tree details.ft-group > summary:hover { background: #e1e4e8; }
        /* File summary: the <a> handles the click. */
        #file-tree details.ft-file > summary > .ft-file-title {
            flex: 1;
            padding-left: 4px;
            font-weight: 600;
        }
        #file-tree .ft-file-title { font-weight: 600; }
        #file-tree .ft-file-title.leaf { padding-left: 24px; }
        #file-tree .ft-subheadings { padding-left: 0; }
        #file-tree .ft-heading {
            display: block;
            color: #586069;
            text-decoration: none;
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border-left: 2px solid transparent;
            padding: 3px 8px 3px 24px;
        }
        #file-tree .ft-heading[data-level="2"] { padding-left: 36px; }
        #file-tree .ft-heading[data-level="3"] { padding-left: 48px; font-size: 11.5px; }
        #file-tree .ft-heading[data-level="4"] { padding-left: 60px; font-size: 11.5px; }
        #file-tree .ft-heading[data-level="5"] { padding-left: 72px; font-size: 11px; }
        #file-tree .ft-heading[data-level="6"] { padding-left: 84px; font-size: 11px; }

        /* Print styles - ensure full document prints */
        @media print {
            body.show-line-numbers #preview [data-line]::before {
                display: none;
            }

            body {
                height: auto;
                overflow: visible;
            }

            #preview-container {
                display: block !important;
                overflow: visible;
                height: auto;
            }

            #drop-zone {
                display: none !important;
            }

            #preview {
                max-width: 100%;
            }

            /* Avoid page breaks inside code blocks and tables */
            pre, table, .code-block-wrapper {
                page-break-inside: avoid;
            }

            /* Prevent images from being cut off at page breaks */
            #preview img {
                display: block;
                break-inside: avoid;
                page-break-inside: avoid;
                overflow: visible;
                position: static;
                max-width: 100%;
            }

            /* Also prevent breaks in mermaid diagrams and math expressions */
            .mermaid, .katex-display {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* Hide copy buttons when printing */
            .copy-button {
                display: none !important;
            }

            /* Hide footnote hover tooltip when printing */
            #footnote-tooltip {
                display: none !important;
            }

            /* Hide TOC sidebar when printing */
            #toc-sidebar {
                display: none !important;
            }

            #app-container {
                display: block !important;
            }

            /* Preserve code block backgrounds when printing */
            #preview pre {
                background: #f6f8fa !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #preview code {
                background: #f6f8fa !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* Preserve syntax highlighting colors */
            #preview pre code {
                background: none !important;
            }

            /* Force light backgrounds for print even when dark mode is active */
            body.dark-mode,
            body.dark-mode #preview-container,
            body.dark-mode #preview {
                background: #ffffff !important;
                color: #24292e !important;

        /* ---- Marp slide mode ---- */
        body.marp #toc-sidebar { display: flex; }
        /* Non-workspace Marp shows a slide TOC in scroll / list modes; deck mode
           hides the whole sidebar so the slide stays immersive. */
        body.marp:not(.workspace).deck-mode #toc-sidebar { display: none; }
        body.marp #preview { max-width: none; padding: 0; background: #2a2a2a; }
        body.marp #preview > div.marpit > svg[data-marpit-svg] {
            display: block;
            margin: 24px auto;
            background: white;
            box-shadow: 0 2px 18px rgba(0,0,0,0.35);
            width: min(1100px, calc(100% - 48px));
            height: auto;
            aspect-ratio: 16 / 9;
        }
        /* Per-slide footnotes — compact block pinned to the bottom of the slide
           it is referenced on. Standard Marp themes lay sections out as flex
           columns; margin-top:auto pushes the block down. The defensive
           display:flex on .marp-has-footnotes keeps it bottom-aligned even on
           custom themes that don't flex their sections. */
        body.marp #preview section.marp-has-footnotes {
            display: flex;
            flex-direction: column;
        }
        body.marp #preview section .marp-footnotes {
            margin-top: auto;
            border-top: 1px solid rgba(0,0,0,0.18);
            padding-top: 0.4em;
            font-size: 0.52em;
            line-height: 1.45;
            opacity: 0.78;
        }
        body.marp #preview section .marp-footnote-item { margin: 0.15em 0; }
        body.marp #preview section .marp-footnote-item .marp-fn-num { margin-right: 0.2em; }
        body.marp #preview section .marp-footnote-item .marp-fn-body { display: inline; }
        body.marp #preview section .marp-footnote-item .marp-fn-body > :first-child { margin-top: 0; }
        body.marp #preview section .marp-footnote-item .marp-fn-body > :last-child { margin-bottom: 0; }
        body.marp #preview section[class*="split"] > .marp-footnotes { grid-column: 1 / -1; }
        body.marp.numbered #preview h2::before,
        body.marp.numbered #preview h3::before,
        body.marp.numbered #preview h4::before { content: none; }

        /* 図表センタリング — 文章 → 図表の順で並ぶスライドで、
           最初の図表以降を .marp-figure-stage にまとめて残りスペースの中央へ寄せる。
           split レイアウトは grid 配置のため対象外 (marp-has-figs を付与しない)。
           Marp 標準テーマは section を flex column にしているため display を強制せず
           justify-content だけ flex-start に固定し、stage 自体に flex:1 で残り空間を
           取らせ、内部で justify-content:center により上下中央に揃える。 */
        body.marp #preview section.marp-has-figs {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        body.marp #preview section.marp-has-figs > .marp-figure-stage {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            /* horizontal centering handled per child (text-align for inline SVG,
               margin:auto for block tables) — avoid align-items:center because it
               collapses the mermaid wrapper width and shrinks the inline SVG. */
        }
        body.marp #preview section.marp-has-figs > .marp-figure-stage > .mermaid {
            margin: 0;
            text-align: center;
        }
        body.marp #preview section.marp-has-figs > .marp-figure-stage > .csv-table {
            margin: 0 auto;
        }
        body.marp #preview section.marp-has-figs > .marp-figure-stage > table {
            margin: 0 auto;
        }
        body.marp #preview section.marp-has-figs > .marp-figure-stage > p {
            margin: 0;
            text-align: center;
        }
        /* Plotly: drop the standalone auto margins (vertical centering is the
           stage's job via justify-content:center + gap) and pin full width so
           an autosize chart fills the slide. align-items:center centers the
           inner Plotly container horizontally for charts with an explicit
           layout.width narrower than the slide (no-op for full-width ones). */
        body.marp #preview section.marp-has-figs > .marp-figure-stage > .plotly-block {
            margin: 0;
            width: 100%;
            align-items: center;
        }

        /* Split (multi-column) layout — activated by <!-- _class: split --> or
           split-2 / split-3 / split-4. The renderMarp() post-pass wraps the
           direct children of section.split* into <div class="split-col"> groups
           separated by `+++` lines in the source. */

        body.marp #preview section.split-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-content: start;
        }
        body.marp #preview section.split-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            align-content: start;
        }
        body.marp #preview section.split-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-content: start;
        }
        body.marp #preview section[class*="split"] > .split-col { min-width: 0; align-self: start; }
        body.marp #preview section[class*="split"] > .split-col > :first-child { margin-top: 0; }
        /* Leading h1/h2 before the first +++ become a full-width header row
           sitting above the columns, so all columns start at the same y. */
        body.marp #preview section[class*="split"] > h1,
        body.marp #preview section[class*="split"] > h2 {
            grid-column: 1 / -1;
            margin-top: 0;
        }

        /* Inline column region — ::: columns … +++ … ::: で、スライド途中だけを
           カラム化する（前後は通常の全幅1カラムのまま）。split が section 全体を
           grid 化するのに対し、こちらは section 内の1ブロックを grid 化する。
           列の中身は split と同じ .split-col クラスを再利用。列数は内部の
           +++ 数（または columns-N 指定）で 2〜4 列。 */

           output renders multi-column in normal documents too, not just Marp. */

            display: grid;

            gap: 30px;
            align-items: start;
            margin: 0.6em 0;

            align-items: center;
            justify-content: center;
            padding: 0;
        }

        body.marp.deck-mode #preview > div.marpit > svg[data-marpit-svg] {
            display: none;
            margin: 0;
        }

            display: block;

        body.marp.deck-mode.deck-zoomed #preview > div.marpit > svg[data-marpit-svg].active { cursor: grab; }
        body.marp.deck-mode.deck-panning #preview > div.marpit > svg[data-marpit-svg].active { cursor: grabbing; }

        /* Laser pointer (Z key, deck mode). A viewport-fixed canvas overlay tracks
           the physical cursor (clientX/clientY), so it is correct regardless of the
           deck zoom/pan transform on the active slide. Color is CSS-specified via
           --laser-color: a Marp theme can set it on `section`; this :root value is
           the fallback used by the built-in themes that don't define it. */

        #laser-canvas {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9500;

           in #preview paints a highlighter band BEHIND the glyphs (text stays
           crisp) via the CSS Custom Highlight API, instead of the native blue
           selection, then auto-fades after ~2s. Because the highlight is range-
           based, the browser paints and re-positions it natively — so it follows
           the live selection smoothly as you drag and stays aligned under the
           Marp deck-mode zoom/pan with no manual coordinates. The selection range
           itself is kept so Ctrl+C still copies. The native selection color is
           suppressed in #preview only when the API is available (body.marker-
           supported), so unsupported engines keep their normal selection.
           Marker color resolves from --marker-color (default highlighter yellow);
           a Marp theme or user style can rebrand it by setting --marker-color on
           section / #preview, just like --laser-color brands the laser pointer.

           alpha) is written into a dedicated <style id="marker-style"> from JS,
           because Chromium highlight pseudos do not inherit custom properties, so a
           var() here would not resolve. */

        body.marker-supported.marp #preview ::selection { background: transparent; }

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            align-content: start;
        }
        body.marp.list-mode #preview > div.marpit { display: contents; }
        body.marp.list-mode #preview > div.marpit > svg[data-marpit-svg] {
            display: block;
            margin: 0;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.45);

        }

        }

        #slide-counter {
            display: none;
            position: fixed;
            bottom: 14px;
            right: 18px;
            background: rgba(0,0,0,0.65);
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 13px;
            z-index: 9000;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

<h2 id="marp-プレビュー機能">Marp プレビュー機能</h2>
<p>このファイルは、本ツールで Marp 形式のスライドをそのままプレビューできることを示すサンプルです。</p>
<ul>
<li>フロントマターに <code>marp: true</code> を書くだけで自動切替</li>
<li><code>P</code> キーで デッキモード（1 枚ずつ表示）に切替</li>
<li><code>←</code> / <code>→</code> でスライド移動、<code>F</code> でフルスクリーン</li>
<li><code>theme: newton</code> のように <code>assets/marp/*.css</code> の独自テーマも指定可能</li>
</ul>
</section>

<h2 id="シンタックスハイライト">シンタックスハイライト</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust hljs" data-highlighted="yes"><span class="hljs-keyword">fn</span> <span class="hljs-title function_">main</span>() {
    <span class="hljs-built_in">println!</span>(<span class="hljs-string">"Hello, Marp!"</span>);
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="magenta" data-marpit-pagination="14" style="--paginate:true;--theme:magenta;" data-marpit-pagination-total="21" class="marp-has-footnotes">
<h2 id="脚注">脚注</h2>
<p>Marp 標準では脚注は未対応ですが、本ツールでは有効です<sup class="footnote-ref"><a href="#fn-impl" id="fnref-impl-1" data-footnote-id="impl">1</a></sup>。参照元と同じスライドの下部に、そのスライドの脚注だけがコンパクトに表示されます<sup class="footnote-ref"><a href="#fn-placement" id="fnref-placement-1" data-footnote-id="placement">2</a></sup>。番号は全スライド通しで振られます<sup class="footnote-ref"><a href="#fn-export" id="fnref-export-1" data-footnote-id="export">3</a></sup>。</p>
<div class="marp-footnotes"><div class="marp-footnote-item" id="fn-impl"><sup class="marp-fn-num">1</sup> <span class="marp-fn-body"><code>[^id]</code> 構文を marp-core に渡す前にプレースホルダ化し、レンダリング後に <code>&lt;sup&gt;</code> に戻す方式です。</span></div><div class="marp-footnote-item" id="fn-placement"><sup class="marp-fn-num">2</sup> <span class="marp-fn-body">各スライド末尾に小さめのフォントで配置されます。</span></div><div class="marp-footnote-item" id="fn-export"><sup class="marp-fn-num">3</sup> <span class="marp-fn-body">HTML エクスポートでもそのまま保持されます。</span></div></div></section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="split" data-theme="magenta" class="split" data-marpit-pagination="15" style="--paginate:true;--class:split;--theme:magenta;" data-marpit-pagination-total="21"><h2 id="2カラムレイアウト">2カラムレイアウト</h2><div class="split-col"><h3 id="基本記法">基本記法</h3>
<p>Marp 標準では生 HTML が必要な「左右分割」を、<code>&lt;!-- _class: split --&gt;</code> ディレクティブと <code>+++</code> 区切りだけで実現できます。</p>
<ul>
<li>左側に説明文</li>
<li>右側に箇条書きや画像</li>
<li><code>+++</code> を行頭単独で書くと列が分かれる</li>
</ul>
</div><div class="split-col">
<h3 id="使いどころ">使いどころ</h3>
<ul>
<li>ビフォー / アフターの比較</li>
<li>図と説明を並べる</li>
<li>メリット / デメリット表</li>
</ul>
<p>コードフェンス内の <code>+++</code> は分割されません:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-diff hljs" data-highlighted="yes"><span class="hljs-comment">+++ a/file.txt</span>
<span class="hljs-comment">--- b/file.txt</span>
</code></pre>
</div></section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="magenta" data-marpit-pagination="16" style="--paginate:true;--theme:magenta;" data-marpit-pagination-total="21">
<h2 id="スライド途中からのカラム">スライド途中からのカラム</h2>
<p>通常は1カラムで導入文を書きます。<code>&lt;!-- _class: split --&gt;</code> と違いスライド全体を分割しません。</p>
<div class="inline-cols"><div class="split-col">
<h3 id="左カラム">左カラム</h3>
<ul>
<li><code>::: columns</code> で領域を開始</li>
<li>内部の <code>+++</code> で列を区切る</li>
<li>列内に <code>::: center</code> も使える</li>
</ul>
</div><div class="split-col">
<h3 id="右カラム">右カラム</h3>
<div class="align-center">
<p><strong>中央寄せ</strong>も列内で機能</p>
</div>
</div></div>
<p><code>:::</code> で領域を閉じると、再び全幅の1カラムに戻ります。<code>::: columns-3</code> のように列数を明示することもできます（既定は <code>+++</code> の数で自動）。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="magenta" data-marpit-pagination="17" style="--paginate:true;--theme:magenta;" data-marpit-pagination-total="21">
<h2 id="強調メッセージ">強調メッセージ</h2>
<p><code>::: message</code> … <code>:::</code> で囲むと、中央寄せ＋大きな太字＋上下のアクセント罫で強調表示されます。<br>
結論やキーメッセージを読みやすく提示したいときに使います。</p>
<div class="md-message">
<p>結論：このまま進めて問題ありません</p>
</div>
<p><code>::: center</code> が配置だけなのに対し、<code>::: message</code> は文字サイズ・太さ・罫線で視覚的に強調します。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="magenta" data-marpit-pagination="18" style="--paginate:true;--theme:magenta;" data-marpit-pagination-total="21">
<h2 id="インラインスタイル">インラインスタイル</h2>
<p>文の一部だけ色・サイズ・書体を変えるには <code>[テキスト]{属性}</code> 記法を使います。</p>
<ul>
<li>売上は<span style="color:#e91e63;font-size:1.4em;font-weight:700">前年比 +28%</span>で着地</li>
<li>注記は<span style="color:gray;font-size:0.85em">小さめのグレー</span>で</li>
<li><span style="font-family:Georgia, 'Times New Roman', 'Yu Mincho', YuMincho, 'Hiragino Mincho ProN', serif">明朝体での引用</span>や<span style="font-family:Consolas, 'Courier New', 'Cascadia Mono', monospace">等幅コード風</span>も可</li>
</ul>
<p>スライドでも通常プレビューと同じ構文がそのまま効きます（<code>color</code>/<code>size</code>/<code>font</code>/<code>bg</code>/<code>weight</code>/<code>valign</code>）。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="split-3" data-theme="magenta" class="split-3" data-marpit-pagination="19" style="--paginate:true;--class:split-3;--theme:magenta;" data-marpit-pagination-total="21"><h2 id="3カラム特徴紹介">3カラム特徴紹介</h2><div class="split-col"><h3 id="シンプル">シンプル</h3>
<p><code>+++</code> を 2 回書くだけで 3 カラムに展開されます。<code>split-4</code> で 4 カラムまで対応。</p>
</div><div class="split-col">
<h3 id="柔軟">柔軟</h3>
<p>各カラムには見出し、リスト、コード、画像、数式、脚注、mermaid まで配置できます。</p>
</div><div class="split-col">
<h3 id="安全">安全</h3>
<p><code>html: false</code> を維持したまま実現しているため、Marp 標準のセキュリティモデルから逸脱しません。</p>
</div></section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="split" data-theme="magenta" class="split" data-marpit-pagination="20" style="--paginate:true;--class:split;--theme:magenta;" data-marpit-pagination-total="21"><h2 id="カラム内の楽譜">カラム内の楽譜</h2><div class="split-col"><h3 id="説明">説明</h3>
<p><code>split</code> レイアウトの各カラムにも <code>abc</code> 楽譜を配置できます。</p>
<ul>
<li>左に解説、右に譜面</li>
<li>SVG に viewBox を付与して描画するので、狭いカラム幅でも途切れず自動で縮小</li>
</ul>
</div><div class="split-col">

<h2 id="スライドの自動縮小はみ出し時">スライドの自動縮小（はみ出し時）</h2>
<p>1 枚に収まりきらないほど内容が多いスライドは、<code>A</code> キーが ON のとき（既定）自動で一律縮小されて全体が 1 枚に収まります。<code>A</code> キーで OFF にすると従来どおり下端で切り取られます。</p>
<ul>
<li>行 1: 長文の箇条書きをたくさん並べても、下端からはみ出さずに収まります。</li>
<li>行 2: 縮小はレイアウト・改行・図表・縦位置・背景・分割/カラムを保ったまま均等に行われます。</li>
<li>行 3: 縮小率の下限は 0.5 で、それ以上はみ出す分は従来どおりクリップされます。</li>
<li>行 4: スクロール / デッキ / リストのどのモードでも同じ見た目になります。</li>
<li>行 5: HTML エクスポートにも縮小結果がそのまま反映されます。</li>

<script>
(function () {
  var sidebar = document.getElementById('toc-sidebar');
  var toggle = document.getElementById('toc-toggle');
  var previewContainer = document.getElementById('preview-container');

  // --- TOC collapse toggle ---
  if (sidebar && toggle) {
    try {
      if (localStorage.getItem('tocCollapsed') === 'true') sidebar.classList.add('collapsed');
    } catch (e) {}
    toggle.addEventListener('click', function () {
      var collapsed = sidebar.classList.toggle('collapsed');
      try { localStorage.setItem('tocCollapsed', collapsed); } catch (e) {}
    });
  }

  // --- File-tree: highlight current page in workspace exports ---
  var ft = document.getElementById('file-tree');
  if (ft) {
    var herePath = location.pathname.replace(/\\/g, '/').toLowerCase();
    var hereFile = herePath.split('/').pop();
    var bestMatch = null;
    ft.querySelectorAll('.ft-item').forEach(function (a) {
      var href = a.getAttribute('href') || '';
      var hrefName = href.split('/').pop().split('?')[0].toLowerCase();
      if (hrefName && hrefName === hereFile) bestMatch = a;
    });
    if (bestMatch) {
      bestMatch.classList.add('active');
      var parent = bestMatch.parentElement;
      while (parent && parent !== ft) {
        if (parent.tagName === 'DETAILS') parent.open = true;
        parent = parent.parentElement;
      }
    }
  }

  // --- Scrollspy: highlight active TOC item as body scrolls ---
  if (sidebar && previewContainer && 'IntersectionObserver' in window) {
    var tocItems = sidebar.querySelectorAll('.toc-item[data-target]');
    if (tocItems.length > 0) {
      var headings = [];
      tocItems.forEach(function (item) {
        var id = item.getAttribute('data-target');
        var h = id ? document.getElementById(id) : null;
        if (h) headings.push(h);
        item.addEventListener('click', function (e) {
          var target = document.getElementById(item.getAttribute('data-target'));
          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var id = entry.target.id;
            tocItems.forEach(function (item) {
              item.classList.toggle('active', item.getAttribute('data-target') === id);
            });
          }
        });
      }, { root: previewContainer, rootMargin: '-10% 0px -80% 0px', threshold: 0 });
      headings.forEach(function (h) { observer.observe(h); });
    }
  }

  // --- Footnote popup tooltips ---
  var footnoteItems = document.querySelectorAll('.footnotes .footnote-item');
  if (footnoteItems.length > 0) {
    function footnoteSafeId(id) {
      return String(id).replace(/[^A-Za-z0-9_-]/g, '_');
    }
    var defs = {};
    footnoteItems.forEach(function (li) {
      var id = li.id.replace(/^fn-/, '');
      var content = li.querySelector('.footnote-content');
      if (id && content) defs[id] = content.innerHTML;
    });

    var styleEl = document.createElement('style');
    styleEl.textContent = ''
      + '.footnote-popup{position:absolute;z-index:9999;max-width:400px;padding:10px 14px;'
      + 'background:#fff;color:#24292e;border:1px solid #d0d7de;border-radius:6px;'
      + 'box-shadow:0 4px 16px rgba(0,0,0,0.15);font-size:0.92em;line-height:1.5;'
      + 'display:none;pointer-events:auto;}'
      + '.footnote-popup.visible{display:block;}'
      + '.footnote-popup p{margin:0 0 0.5em 0;}'
      + '.footnote-popup p:last-child{margin-bottom:0;}'
      + 'body.dark-mode .footnote-popup{background:#161b22;color:#c9d1d9;border-color:#30363d;'
      + 'box-shadow:0 4px 16px rgba(0,0,0,0.6);}';
    document.head.appendChild(styleEl);

    var popup = document.createElement('div');
    popup.className = 'footnote-popup';
    document.body.appendChild(popup);

    var hideTimer = null;
    function cancelHide() { if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
    function scheduleHide() {
      cancelHide();
      hideTimer = setTimeout(function () { popup.classList.remove('visible'); }, 180);
    }
    function showPopup(trigger, id) {
      var html = defs[id];
      if (!html) return;
      cancelHide();
      popup.innerHTML = html;
      popup.classList.add('visible');
      var rect = trigger.getBoundingClientRect();
      var pw = popup.offsetWidth;
      var ph = popup.offsetHeight;
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var left = rect.left + window.scrollX;
      var top = rect.bottom + window.scrollY + 6;
      if (left + pw > window.scrollX + vw - 8) left = window.scrollX + vw - pw - 8;
      if (left < window.scrollX + 8) left = window.scrollX + 8;
      if (rect.bottom + 6 + ph > vh && rect.top - 6 - ph > 0) {
        top = rect.top + window.scrollY - ph - 6;
      }
      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
    }

    popup.addEventListener('mouseenter', cancelHide);
    popup.addEventListener('mouseleave', scheduleHide);

    var activeRef = null;
    document.querySelectorAll('.footnote-ref a[data-footnote-id]').forEach(function (a) {
      var id = footnoteSafeId(a.getAttribute('data-footnote-id'));
      a.addEventListener('mouseenter', function () { activeRef = a; showPopup(a, id); });
      a.addEventListener('mouseleave', scheduleHide);
      a.addEventListener('focus', function () { activeRef = a; showPopup(a, id); });
      a.addEventListener('blur', scheduleHide);
      a.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'touch') {
          e.preventDefault();
          if (activeRef === a && popup.classList.contains('visible')) {
            popup.classList.remove('visible');
            activeRef = null;
          } else {
            activeRef = a;
            showPopup(a, id);
          }
        }
      });
    });

    document.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'touch') return;
      if (popup.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.footnote-ref')) return;
      popup.classList.remove('visible');
      activeRef = null;
    });
  }

  // --- Plotly charts: re-render from snapshotted specs ---
  // The artifact's .plotly-block divs carry a data-plotly-spec JSON attribute
  // populated by buildExportArtifact() at export time. Run Plotly.newPlot
  // once the deferred CDN script has loaded the library.
  function initPlotlyArtifact() {
    var blocks = document.querySelectorAll('.plotly-block[data-plotly-spec]');
    if (blocks.length === 0) return;
    if (typeof Plotly === 'undefined') {
      window.addEventListener('load', initPlotlyArtifact, { once: true });
      return;
    }
    blocks.forEach(function (el) {
      try {
        var spec = JSON.parse(el.getAttribute('data-plotly-spec') || 'null');
        if (!spec) return;
        Plotly.newPlot(el, spec.traces || [], spec.layout || {}, spec.config || {});
      } catch (e) {
        el.textContent = 'Plotly init failed: ' + e.message;
      }
    });
  }
  initPlotlyArtifact();
})();</script>
